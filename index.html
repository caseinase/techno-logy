<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Tech-no-Logy - Review Gadget Jujur & Terpercaya</title>
    <meta name="description" content="Portal review gadget paling jujur untuk Guru, Mahasiswa, dan Pemula. Bahas TWS, Tablet, dan HP dengan bahasa manusia, bukan bahasa robot.">
    <meta name="keywords" content="Review Gadget Jujur, Tech-no-Logy, Review TWS Murah, Huawei MatePad PaperMatte, Tablet Guru, Gadget Pendidikan">
    <meta name="author" content="Pak Bos Tech-no-Logy">
    <meta name="robots" content="index, follow">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #004a99; --secondary: #00d4ff; --dark: #0f172a; --bg: #f8fafc; --text: #334155; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); }

        /* NAVBAR SIMPEL */
        nav { background: var(--primary); padding: 15px 5%; display: flex; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .logo { color: white; font-weight: 800; font-size: 1.5rem; text-decoration: none; letter-spacing: -1px; }

        /* HERO & SEARCH SECTION */
        .hero-section {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 60px 20px 80px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: -35px;
        }
        
        .hero-title { color: white; font-size: 2rem; margin-bottom: 20px; font-weight: 800; }
        
        .search-wrapper {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }
        
        .main-search {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            outline: none;
            transition: 0.3s;
        }
        .main-search:focus { transform: scale(1.02); box-shadow: 0 15px 40px rgba(0,0,0,0.3); }

        /* KATEGORI CHIPS */
        .category-scroll {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            position: relative;
            z-index: 10;
        }

        .cat-chip {
            background: white;
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            font-weight: 600;
            color: var(--text);
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 0.9rem;
        }

        .cat-chip:hover { transform: translateY(-3px); }
        
        .cat-chip.active {
            background: var(--secondary);
            color: var(--dark);
            border-color: var(--secondary);
            font-weight: 800;
        }

        /* GRID BERITA */
        .news-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            min-height: 400px;
        }

        /* CARD STYLE */
        .news-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        .card-img {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }
        
        .card-body { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .card-tag { 
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase; 
            color: var(--primary); margin-bottom: 10px; letter-spacing: 1px;
            display: inline-block;
        }
        
        .card-title {
            font-size: 1.15rem; font-weight: 800; color: var(--dark);
            margin-bottom: 10px; line-height: 1.4;
        }
        
        .card-desc {
            font-size: 0.9rem; color: #64748b; margin-bottom: 15px;
        }

        .card-footer {
            margin-top: auto;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary);
            display: flex; align-items: center; gap: 5px;
        }

        footer { text-align: center; padding: 50px 20px; color: #94a3b8; font-size: 0.9rem; margin-top: 50px; border-top: 1px solid #e2e8f0; }

        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">TECH-NO-LOGY</a>
</nav>

<div class="hero-section">
    <h1 class="hero-title">Mau Cari Review Apa?</h1>
    <div class="search-wrapper">
        <input type="text" id="searchInput" class="main-search" placeholder="Cari gadget (Contoh: Huawei, TWS...)" onkeyup="filterNews()">
    </div>
</div>

<div class="category-scroll">
    <button class="cat-chip active" onclick="filterCategory('all', this)">Semua</button>
    <button class="cat-chip" onclick="filterCategory('Audio', this)">Audio</button>
    <button class="cat-chip" onclick="filterCategory('Tablet', this)">Tablet</button>
</div>

<div class="news-container" id="newsGrid">
    </div>

<footer>
    &copy; 2026 Tech-no-Logy. Website Review Paling Jujur.
</footer>

<script>
    const newsData = [
        {
            title: "Revolusi TWS 100 Ribuan? Review Jujur KiiP Wireless DTS16",
            category: "Audio",
            desc: "TWS murah dengan layar sentuh LCD. Gimmick atau inovasi?",
            link: "audio-080226.html",
            icon: "🎧",
            color: "linear-gradient(135deg, #10b981, #3b82f6)"
        },
        {
            title: "Tablet Rasa Kertas? Review Huawei MatePad 11.5 PaperMatte",
            category: "Tablet",
            desc: "Layar anti-silau yang enak buat ngetik. Pengganti laptop?",
            link: "tablet-080226.html",
            icon: "📱",
            color: "linear-gradient(135deg, #3b82f6, #8b5cf6)"
        }
    ];

    const newsGrid = document.getElementById('newsGrid');
    let currentCategory = 'all';

    function renderNews(data) {
        newsGrid.innerHTML = '';
        
        if(data.length === 0) {
            newsGrid.innerHTML = '<p style="text-align:center; width:100%; color:#94a3b8; grid-column: 1/-1; margin-top:30px;">Maaf Bos, artikel yang dicari belum ada.</p>';
            return;
        }

        data.forEach(item => {
            const card = `
                <a href="${item.link}" class="news-card fade-in">
                    <div class="card-img" style="background: ${item.color}">
                        ${item.icon}
                    </div>
                    <div class="card-body">
                        <span class="card-tag">${item.category}</span>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                        <div class="card-footer">Baca Review →</div>
                    </div>
                </a>
            `;
            newsGrid.innerHTML += card;
        });
    }

    function filterCategory(cat, btnElement) {
        currentCategory = cat;
        document.querySelectorAll('.cat-chip').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        if (cat === 'all') {
            renderNews(newsData);
        } else {
            const filtered = newsData.filter(n => n.category === cat);
            renderNews(filtered);
        }
    }

    function filterNews() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        
        const filtered = newsData.filter(item => {
            const titleMatch = item.title.toLowerCase().includes(query);
            const catMatch = currentCategory === 'all' ? true : item.category === currentCategory;
            return titleMatch && catMatch;
        });

        renderNews(filtered);
    }

    window.onload = () => renderNews(newsData);
</script>

</body>
</html>
