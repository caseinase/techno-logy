<aside class="sidebar">
    <div class="sidebar-widget">
        <h3 class="widget-title">Cari Berita</h3>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Ketik gadget atau info..." onkeyup="searchNews()">
            <div id="searchSuggestions" style="background: white; position: absolute; width: 250px; border: 1px solid #ddd; display: none; z-index: 100; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);"></div>
        </div>
    </div>

    <div class="sidebar-widget">
        <h3 class="widget-title">Kategori</h3>
        <ul class="category-list" id="categoryList">
            <li><a href="#">Audio & TWS <span class="cat-count" id="count-audio">0</span></a></li>
            <li><a href="#">Smartphone <span class="cat-count" id="count-smartphone">0</span></a></li>
            <li><a href="#">Tablet Kerja <span class="cat-count" id="count-tablet">0</span></a></li>
            <li><a href="#">Edukasi/UKS <span class="cat-count" id="count-edukasi">0</span></a></li>
        </ul>
    </div>

    <div class="sidebar-widget">
        <h3 class="widget-title">Paling Banyak Dibaca</h3>
        <ol class="hotline-list" id="popularNews" style="padding-left: 20px;">
            </ol>
    </div>
</aside>

<script>
// 1. DATA BERITA (Daftar semua judul berita Anda di sini)
const newsDatabase = [
    { title: "Review KiiP Wireless DTS16: Smart Screen 165rb", link: "berita-tws.html", category: "audio" },
    { title: "Review Huawei MatePad 11.5 2025 PaperMatte", link: "berita-tablet.html", category: "tablet" },
    { title: "Materi Ajar SMP Kelas 7 & 8", link: "materi-smp.html", category: "edukasi" },
    { title: "Panduan Kawasan Bebas Jentik UKS", link: "uks-jentik.html", category: "edukasi" }
];

// 2. FUNGSI SEARCH DENGAN REKOMENDASI
function searchNews() {
    let input = document.getElementById('searchInput').value.toLowerCase();
    let suggestionBox = document.getElementById('searchSuggestions');
    suggestionBox.innerHTML = "";
    
    if (input.length > 0) {
        let matches = newsDatabase.filter(news => news.title.toLowerCase().includes(input));
        if (matches.length > 0) {
            suggestionBox.style.display = "block";
            matches.forEach(match => {
                let div = document.createElement('div');
                div.innerHTML = `<a href="${match.link}" style="display:block; padding:10px; text-decoration:none; color:#333; font-size:0.85rem; border-bottom:1px solid #eee;">${match.title}</a>`;
                suggestionBox.appendChild(div);
            });
        } else { suggestionBox.style.display = "none"; }
    } else { suggestionBox.style.display = "none"; }
}

// 3. FUNGSI HITUNG KATEGORI & POPULER (localStorage)
function updateStats() {
    // Simulasi hitung kategori
    document.getElementById('count-audio').innerText = newsDatabase.filter(n => n.category === 'audio').length;
    document.getElementById('count-tablet').innerText = newsDatabase.filter(n => n.category === 'tablet').length;
    document.getElementById('count-edukasi').innerText = newsDatabase.filter(n => n.category === 'edukasi').length;

    // Hitung Klik Halaman Ini
    let currentPage = window.location.pathname.split("/").pop();
    let viewCount = localStorage.getItem(currentPage) || 0;
    localStorage.setItem(currentPage, parseInt(viewCount) + 1);

    // Tampilkan Peringkat Populer
    let popularList = document.getElementById('popularNews');
    let sortedNews = newsDatabase.map(n => {
        return { ...n, views: parseInt(localStorage.getItem(n.link) || 0) };
    }).sort((a, b) => b.views - a.views);

    sortedNews.forEach((news, index) => {
        let li = document.createElement('li');
        li.innerHTML = `<a href="${news.link}">${news.title}</a><small>${news.views} Pembaca</small>`;
        popularList.appendChild(li);
    });
}

window.onload = updateStats;
</script>
